<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Examples of preprocessed MRI images">
  <defs>
    <style>
      .title { font: 700 30px 'Sora', Arial, sans-serif; fill: #0f172a; }
      .cap { font: 600 42px 'Georgia', serif; fill: #fff; }
      .sub { font: 700 54px 'Sora', Arial, sans-serif; fill: #334155; }
    </style>
    <linearGradient id="mri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="900" rx="24" fill="#f8fbff"/>
  <text x="60" y="60" class="title">Preprocessed MRI Samples by Class</text>

  <g transform="translate(40,100)">
    <g>
      <rect x="0" y="0" width="360" height="250" fill="#000"/>
      <rect x="18" y="15" width="324" height="220" fill="url(#mri)"/>
      <ellipse cx="185" cy="120" rx="82" ry="92" fill="rgba(255,255,255,0.15)"/>
    </g>
    <g transform="translate(390,0)">
      <rect x="0" y="0" width="360" height="250" fill="#000"/>
      <rect x="18" y="15" width="324" height="220" fill="url(#mri)"/>
      <ellipse cx="180" cy="120" rx="84" ry="94" fill="rgba(255,255,255,0.15)"/>
      <circle cx="220" cy="95" r="24" fill="rgba(239,68,68,0.6)"/>
    </g>
    <g transform="translate(780,0)">
      <rect x="0" y="0" width="360" height="250" fill="#000"/>
      <rect x="18" y="15" width="324" height="220" fill="url(#mri)"/>
      <ellipse cx="180" cy="120" rx="86" ry="92" fill="rgba(255,255,255,0.1)"/>
    </g>
    <g transform="translate(1170,0)">
      <rect x="0" y="0" width="360" height="250" fill="#000"/>
      <rect x="18" y="15" width="324" height="220" fill="url(#mri)"/>
      <ellipse cx="180" cy="120" rx="82" ry="91" fill="rgba(255,255,255,0.14)"/>
      <ellipse cx="215" cy="135" rx="27" ry="30" fill="rgba(248,113,113,0.62)"/>
    </g>

    <g transform="translate(0,280)">
      <rect x="0" y="0" width="360" height="250" fill="#000"/>
      <rect x="18" y="15" width="324" height="220" fill="url(#mri)"/>
      <ellipse cx="185" cy="120" rx="82" ry="92" fill="rgba(255,255,255,0.13)"/>
      <circle cx="130" cy="95" r="18" fill="rgba(239,68,68,0.6)"/>
    </g>
    <g transform="translate(390,280)">
      <rect x="0" y="0" width="360" height="250" fill="#000"/>
      <rect x="18" y="15" width="324" height="220" fill="url(#mri)"/>
      <ellipse cx="178" cy="120" rx="78" ry="88" fill="rgba(255,255,255,0.14)"/>
      <circle cx="180" cy="130" r="26" fill="rgba(248,113,113,0.6)"/>
    </g>
    <g transform="translate(780,280)">
      <rect x="0" y="0" width="360" height="250" fill="#000"/>
      <rect x="18" y="15" width="324" height="220" fill="url(#mri)"/>
      <ellipse cx="178" cy="120" rx="83" ry="92" fill="rgba(255,255,255,0.11)"/>
    </g>
    <g transform="translate(1170,280)">
      <rect x="0" y="0" width="360" height="250" fill="#000"/>
      <rect x="18" y="15" width="324" height="220" fill="url(#mri)"/>
      <ellipse cx="180" cy="120" rx="84" ry="91" fill="rgba(255,255,255,0.15)"/>
    </g>

    <rect x="45" y="552" width="280" height="70" rx="12" fill="#2f855a"/>
    <text x="185" y="600" text-anchor="middle" class="cap">Glioma</text>
    <rect x="435" y="552" width="280" height="70" rx="12" fill="#2f855a"/>
    <text x="575" y="600" text-anchor="middle" class="cap">Meningioma</text>
    <rect x="825" y="552" width="280" height="70" rx="12" fill="#2f855a"/>
    <text x="965" y="600" text-anchor="middle" class="cap">No-Tumor</text>
    <rect x="1215" y="552" width="280" height="70" rx="12" fill="#2f855a"/>
    <text x="1355" y="600" text-anchor="middle" class="cap">Pituitary</text>
  </g>

  <text x="800" y="860" text-anchor="middle" class="sub">Examples of preprocessed images.</text>
</svg>
