<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 900" role="img" aria-label="Generic CNN architecture for brain tumor MRI classification">
  <defs>
    <style>
      .title { font: 700 34px 'Sora', Arial, sans-serif; fill: #0f172a; }
      .h { font: 700 20px 'Sora', Arial, sans-serif; fill: #fff; }
      .l { font: 600 17px 'Sora', Arial, sans-serif; fill: #0f172a; }
      .m { font: 500 16px 'Sora', Arial, sans-serif; fill: #334155; }
    </style>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#3b82f6"/>
    </marker>
    <linearGradient id="mri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1900" height="900" rx="22" fill="#f8fbff"/>
  <text x="40" y="52" class="title">Generic CNN Architecture for MRI Brain Tumor Classification</text>

  <g transform="translate(70,120)">
    <rect x="0" y="0" width="180" height="200" rx="36" fill="#eef2ff" stroke="#93c5fd"/>
    <rect x="38" y="48" width="96" height="120" fill="url(#mri)"/>
    <text x="90" y="236" text-anchor="middle" class="l">MRI Dataset</text>
  </g>

  <g transform="translate(300,130)">
    <rect x="0" y="0" width="390" height="180" rx="20" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="100" y="14" width="190" height="42" fill="#3b82f6"/>
    <text x="195" y="42" text-anchor="middle" class="h">Preprocessing</text>
    <rect x="18" y="95" width="165" height="70" fill="#3b82f6"/>
    <rect x="210" y="95" width="165" height="70" fill="#3b82f6"/>
    <text x="100" y="128" text-anchor="middle" class="h">Image</text>
    <text x="100" y="153" text-anchor="middle" class="h">Resizing</text>
    <text x="292" y="128" text-anchor="middle" class="h">Image</text>
    <text x="292" y="153" text-anchor="middle" class="h">Augmentation</text>
  </g>

  <g transform="translate(750,130)">
    <rect x="0" y="0" width="95" height="110" fill="#facc15" stroke="#eab308"/>
    <rect x="12" y="14" width="95" height="110" fill="#fbbf24" stroke="#eab308"/>
    <rect x="24" y="28" width="95" height="110" fill="#f59e0b" stroke="#d97706"/>
    <text x="76" y="170" text-anchor="middle" class="l">CNN Layers</text>
  </g>

  <g transform="translate(80,390)">
    <rect x="0" y="0" width="42" height="200" fill="#e5e7eb" stroke="#9ca3af"/>
    <text x="21" y="100" transform="rotate(-90 21,100)" text-anchor="middle" class="l">Input</text>

    <rect x="60" y="30" width="150" height="150" fill="#d1d5db" stroke="#9ca3af"/>
    <rect x="50" y="20" width="150" height="150" fill="#c7ccd3" stroke="#9ca3af"/>
    <rect x="40" y="10" width="150" height="150" fill="#bcc3cc" stroke="#9ca3af"/>
    <text x="130" y="212" text-anchor="middle" class="l">Conv+BN+ReLU</text>

    <rect x="240" y="25" width="42" height="170" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="261" y="110" transform="rotate(-90 261,110)" text-anchor="middle" class="l">MaxPool</text>

    <g transform="translate(320,0)">
      <rect x="60" y="30" width="150" height="150" fill="#d1d5db" stroke="#9ca3af"/>
      <rect x="50" y="20" width="150" height="150" fill="#c7ccd3" stroke="#9ca3af"/>
      <rect x="40" y="10" width="150" height="150" fill="#bcc3cc" stroke="#9ca3af"/>
      <text x="130" y="212" text-anchor="middle" class="l">Conv+BN+ReLU</text>
    </g>

    <rect x="640" y="25" width="42" height="170" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="661" y="110" transform="rotate(-90 661,110)" text-anchor="middle" class="l">MaxPool</text>

    <g transform="translate(720,0)">
      <rect x="60" y="30" width="150" height="150" fill="#d1d5db" stroke="#9ca3af"/>
      <rect x="50" y="20" width="150" height="150" fill="#c7ccd3" stroke="#9ca3af"/>
      <rect x="40" y="10" width="150" height="150" fill="#bcc3cc" stroke="#9ca3af"/>
      <text x="130" y="212" text-anchor="middle" class="l">Conv+BN+ReLU</text>
    </g>

    <rect x="1040" y="25" width="42" height="170" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="1061" y="110" transform="rotate(-90 1061,110)" text-anchor="middle" class="l">MaxPool</text>

    <rect x="1125" y="0" width="44" height="200" fill="#d1d5db" stroke="#9ca3af"/>
    <text x="1147" y="102" transform="rotate(-90 1147,102)" text-anchor="middle" class="l">Flatten</text>

    <rect x="1200" y="30" width="130" height="150" fill="#fca5a5" stroke="#ef4444"/>
    <rect x="1210" y="20" width="130" height="150" fill="#fb7185" stroke="#ef4444"/>
    <rect x="1220" y="10" width="130" height="150" fill="#f87171" stroke="#ef4444"/>
    <text x="1280" y="212" text-anchor="middle" class="l">Dense+ReLU</text>

    <rect x="1378" y="35" width="46" height="160" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="1401" y="115" transform="rotate(-90 1401,115)" text-anchor="middle" class="l">Dropout</text>

    <rect x="1450" y="30" width="130" height="150" fill="#6ee7b7" stroke="#059669"/>
    <rect x="1460" y="20" width="130" height="150" fill="#34d399" stroke="#059669"/>
    <rect x="1470" y="10" width="130" height="150" fill="#10b981" stroke="#059669"/>
    <text x="1535" y="212" text-anchor="middle" class="l">Dense+Softmax</text>

    <rect x="1658" y="10" width="90" height="60" fill="url(#mri)"/>
    <rect x="1658" y="90" width="90" height="60" fill="url(#mri)"/>
    <rect x="1658" y="170" width="90" height="60" fill="url(#mri)"/>
    <rect x="1658" y="250" width="90" height="60" fill="url(#mri)"/>

    <line x1="25" y1="300" x2="1670" y2="300" stroke="#3b82f6" stroke-width="5" marker-end="url(#arr)"/>
  </g>

  <text x="52" y="840" class="m">Input size example: 256 x 256. Four conv blocks with batch normalization and ReLU, max pooling, flatten, dense, dropout, and final softmax for 4-class prediction.</text>
</svg>
